<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Green Sparks Kenya</title>
<meta name="description" content="Browse photos from Green Sparks clean-ups, tree-planting drives, and community events across Kenya.">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{ fontFamily:{sans:['Poppins','sans-serif']},
    colors:{ forest:{DEFAULT:'#166534'}, emerald:{DEFAULT:'#22C55E'}, sky:{DEFAULT:'#0EA5E9'}, earth:{DEFAULT:'#7C5E3C'} },
    boxShadow:{glow:'0 0 40px rgba(34,197,94,0.35)'} } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-white dark:bg-[#0b140f] text-gray-800 dark:text-gray-200 antialiased">

<div id="loading-screen"><div class="leaf-spinner"></div></div>
<div id="navbar-mount"></div>

<header class="hero-bg pt-40 pb-28 relative" style="background-image:url('assets/images/B4 AND AFTER.jpeg')">
  <div class="absolute inset-0 hero-overlay"></div>
  <div class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <span class="reveal inline-flex items-center gap-2 glass-card px-4 py-2 rounded-full text-xs font-semibold text-emerald-700 dark:text-emerald-300 mb-5">Gallery</span>
    <h1 class="reveal text-4xl sm:text-5xl font-extrabold text-white leading-tight" data-delay="1">BEFORE AND <span class="gradient-text">AFTER #PlasticFreeNairobi</span></h1>
  </div>
</header>

<section class="py-20 bg-white dark:bg-[#0b140f]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Filter buttons -->
    <div class="flex flex-wrap justify-center gap-3 mb-12 reveal">
      <button data-filter-btn="all" class="px-5 py-2.5 rounded-full bg-emerald-500 text-white text-sm font-semibold transition">All</button>
      <button data-filter-btn="cleanups" class="px-5 py-2.5 rounded-full bg-white text-gray-700 border border-gray-200 dark:border-white/10 dark:bg-white/5 dark:text-gray-200 text-sm font-semibold transition">Clean-Ups</button>
      <button data-filter-btn="planting" class="px-5 py-2.5 rounded-full bg-white text-gray-700 border border-gray-200 dark:border-white/10 dark:bg-white/5 dark:text-gray-200 text-sm font-semibold transition">Tree Planting</button>
      <button data-filter-btn="education" class="px-5 py-2.5 rounded-full bg-white text-gray-700 border border-gray-200 dark:border-white/10 dark:bg-white/5 dark:text-gray-200 text-sm font-semibold transition">Education</button>
      <button data-filter-btn="events" class="px-5 py-2.5 rounded-full bg-white text-gray-700 border border-gray-200 dark:border-white/10 dark:bg-white/5 dark:text-gray-200 text-sm font-semibold transition">Events</button>
    </div>

    <!-- Gallery grid -->
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="gallery-item reveal img-zoom rounded-2xl overflow-hidden shadow-md" data-category="cleanups">
        <img src="assets/images/B4 AND AFTER.jpeg" class="w-full h-64 object-cover" alt="clean-up volunteers">
      </div>
      <div class="gallery-item reveal img-zoom rounded-2xl overflow-hidden shadow-md" data-category="planting" data-delay="1">
        <img src="assets\images\tree planting.jpeg" class="w-full h-64 object-cover" alt="Tree planting volunteers">
      </div>
      <div class="gallery-item reveal img-zoom rounded-2xl overflow-hidden shadow-md" data-category="education" data-delay="2">
        <img src="assets\images\climate work.jpeg" class="w-full h-64 object-cover" alt="Students learning about recycling">
      </div>
      <div class="gallery-item reveal img-zoom rounded-2xl overflow-hidden shadow-md" data-category="events" data-delay="3">
        <img src="assets\images\deforostation.jpeg" class="w-full h-64 object-cover" alt="Community climate event">
      </div>
      <div class="gallery-item reveal img-zoom rounded-2xl overflow-hidden shadow-md" data-category="cleanups" data-delay="4">
        <img src="assets\images\korogocho.jpeg" class="w-full h-64 object-cover" alt="River clean-up team">
      </div>
      <div class="gallery-item reveal img-zoom rounded-2xl overflow-hidden shadow-md" data-category="planting">
        <img src="assets\images\images tree.jpeg" class="w-full h-64 object-cover" alt="Seedling nursery">
      </div>
      <div class="gallery-item reveal img-zoom rounded-2xl overflow-hidden shadow-md" data-category="education" data-delay="1">
        <img src="assets\images\comunity cleanup.jpeg" class="w-full h-64 object-cover" alt="School recycling program">
      </div>
      <div class="gallery-item reveal img-zoom rounded-2xl overflow-hidden shadow-md" data-category="events" data-delay="2">
        <img src="assets\images\mathare.jpeg" class="w-full h-64 object-cover" alt="Youth climate summit">
      </div>
      <div class="gallery-item reveal img-zoom rounded-2xl overflow-hidden shadow-md" data-category="cleanups" data-delay="3">
        <img src="assets\images\voluntering.jpeg" class="w-full h-64 object-cover" alt="Plastic sorting volunteers">
      </div>
    </div>
  </div>
</section>

<div id="footer-mount"></div>
<button id="back-to-top" aria-label="Back to top" class="gs-hidden-btn fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white shadow-xl flex items-center justify-center"><i class="fa-solid fa-arrow-up"></i></button>

<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
