<!-- Frontend snippet: POST to your deployed backend's /api/register -->
<form id="regForm">
  <input name="name" placeholder="Name">
  <input name="email" placeholder="Email" required>
  <button type="submit">Register</button>
</form>

<script>
const BACKEND_URL = '/api/register'; // change to full URL if backend is on a different origin

document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = { name: form.name.value, email: form.email.value };
  try {
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const json = await res.json();
    if (json.ok) alert('Thanks — registration received!');
    else alert('Error: ' + (json.error || 'unknown'));
  } catch (err) {
    alert('Network error');
  }
});
</script>
